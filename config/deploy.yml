# Name of your application. Used to uniquely configure containers.
service: documentflow

# Name of the container image (use your-user/app-name on external registries).
image: virgostyx/documentflow

# Deploy to these servers.
servers:
  web:
    - 187.55.230.3

# Enable SSL auto certification via Let's Encrypt
# Kamal Proxy gère automatiquement les certificats SSL
proxy:
  ssl: true
  host: documentflowmanagement.com
  app_port: 3000

# Default (10s) is too short for the Collabora accessory, which takes ~50s
# to spawn its first LibreOffice kit process on a cold container start.
# Applies globally (main app deploys well within this, no downside there).
deploy_timeout: 90

# IMPORTANT: Activez aussi config.assume_ssl et config.force_ssl dans config/environments/production.rb

# Where you keep your container images.
registry:
  # Docker Hub (pas besoin de spécifier server, c'est le défaut)
  username: virgostyx
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - DOCUMENTFLOW_DATABASE_PASSWORD
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - AR_ENCRYPTION_PRIMARY_KEY
    - AR_ENCRYPTION_DETERMINISTIC_KEY
    - AR_ENCRYPTION_KEY_DERIVATION_SALT
    - CLOUDFLARE_R2_ACCESS_KEY_ID
    - CLOUDFLARE_R2_SECRET_ACCESS_KEY
  clear:
    RAILS_ENV: production

    # Database configuration (utilise l'accessory PostgreSQL ci-dessous)
    DB_HOST: documentflow-db

    # Solid Queue tourne dans le process Puma (serveur unique)
    SOLID_QUEUE_IN_PUMA: true

    # Puma web server
    WEB_CONCURRENCY: 2          # 3 workers pour 8GB RAM (2 pour 4GB RAM)
    RAILS_MAX_THREADS: 5
    PORT: 3000

    # Logs
    RAILS_LOG_LEVEL: info

    # Cloudflare R2 (Active Storage)
    CLOUDFLARE_R2_BUCKET: documentflowmanagement
    CLOUDFLARE_R2_ENDPOINT: https://73db70054ed12d64dd22412ee03af049.r2.cloudflarestorage.com

    # Email SMTP Configuration (Hostinger)
    SMTP_ADDRESS: smtp.hostinger.com
    SMTP_PORT: 465
    SMTP_DOMAIN: documentflowmanagement.com
    DEFAULT_FROM_EMAIL: no-reply@documentflowmanagement.com

    # Collabora Online (WOPI in-browser document editing, accessory below)
    COLLABORA_BASE_URL: https://office.documentflowmanagement.com

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "documentflow_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

# SSH configuration
ssh:
  user: virgostyx
  port: 2222
  keys: ["~/.ssh/id_ed25519_documentflow"]
  keys_only: true

# Use accessory services (secrets come from .kamal/secrets).
accessories:
  db:
    image: postgres:16-alpine
    host: 187.55.230.3
    port: "127.0.0.1:5432:5432"  # Accessible uniquement en local (pas exposé publiquement)
    env:
      clear:
        POSTGRES_USER: documentflow
        POSTGRES_DB: documentflow_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      # Stockage persistant pour PostgreSQL
      - data:/var/lib/postgresql/data
    options:
      # Health check pour s'assurer que PostgreSQL est prêt
      health-cmd: "pg_isready -U documentflow"
      health-interval: "10s"
      health-timeout: "5s"
      health-retries: 5

  # Collabora Online (WOPI editor for "Edit online"). Runs on the same box
  # as the main app. Pinned to the latest stable tag as of 2026-07-30 —
  # re-check Docker Hub before bumping; don't run :latest long-term.
  collabora:
    image: collabora/code:26.04.2.4.1
    host: 187.55.230.3
    port: "127.0.0.1:9980:9980" # local-only, for debugging; public access goes through the proxy block below
    proxy:
      ssl: true
      host: office.documentflowmanagement.com
      app_port: 9980
      # Collabora has no /up endpoint (Rails convention kamal-proxy defaults
      # to) — it 404s there, so the default healthcheck never passes.
      healthcheck:
        path: /hosting/discovery
    env:
      clear:
        # WOPI host allowlist: Collabora only accepts requests originating
        # this app's domain — the main anti-SSRF control for the WOPI flow.
        aliasgroup1: "https://documentflowmanagement.com:443"
        DONT_GEN_SSL_CERT: "true" # TLS is terminated by kamal-proxy, not coolwsd
        extra_params: >-
          --o:ssl.enable=false
          --o:num_prespawn_children=1
          --o:per_document.max_concurrency=1
          --o:memproportion=50
          --o:net.frame_ancestors=documentflowmanagement.com
      secret:
        - COLLABORA_ADMIN_USERNAME
        - COLLABORA_ADMIN_PASSWORD
    options:
      cap-add:
        - MKNOD
